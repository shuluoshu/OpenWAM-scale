# @package _global_
defaults:
  - /model: dual_system
  - _self_

model:
  architecture:
    action_dim: 112
    state_dim: 112
    attention_mask_mode: mutual
    video_attention_mask_mode: first_frame_causal

goal:
  enabled: true
  format: openwam.goal.patch.v1
  mode: predicted
  conditioning: image_memory
  input_policy: clean_head
  num_steps: 20
  checkpoint: ${oc.env:STAGE1_GOAL_CHECKPOINT,null}
  frozen_dependencies_eval: true
  microbatch_size: 1
  cache_size: 128
  cache_max_bytes: 268435456
  preflight: false

dataloader:
  type: curated_stage2
  source_yaml: null
  data_root: null
  normalization_registry: ${oc.env:STAGE2_STATS_REGISTRY,null}
  seed: ${project.seed}
  max_cached_episodes: 2
  max_cache_bytes: 268435456
  draws_per_epoch: 100000
  gripper_normalization: clip_0_1
  gripper_target_source: controller_command_or_human_openness_target
  gripper_state_filter: {enabled: true, max_step: 0.1, command_tolerance: 0.01, settling_frames: 15, reversal_window: 3, return_tolerance: 0.02}
  observation_augmentation:
    enabled: true
    color_jitter: {p: 0.8, brightness: 0.2, contrast: 0.2, saturation: 0.2}
    patch_mask: {p: 0.5, area_range: [0.05, 0.2], aspect_range: [0.5, 2.0]}
    view_dropout: {p: 0.1, keep_one_view: true}
    state_dropout: {p: 0.1}

training:
  step_unit: optimizer_updates
  expand_action_dim_from_checkpoint: false
  debug: false
  learning_rate: 1.0e-5
  parameter_lrs: {video: 1.0e-5, action: 1.0e-4, projection: 1.0e-3, goal_adapter: 1.0e-4}
  adam_betas: [0.9, 0.95]
  weight_decay: 0.01
  max_grad_norm: 1.0
  num_epochs: null
  max_steps: 5000
  # Start batch1. Increase only after measuring complete forward/backward/update VRAM.
  batch_size: 1
  gradient_accumulation_steps: 1
  lr_scheduler: null
  warmup_ratio: 0.0
  lr_min_ratio: 0.01
  action_lr: 1.0e-4
  video_lr: 1.0e-5
  mixed_precision: bf16
  zero_stage: 2
  use_gradient_checkpointing: true
  use_gradient_checkpointing_offload: false
  initialize_model_on_cpu: true
  offload_optimizer_device: cpu
  lambda_video: 1.0
  lambda_action: 1.0
  lambda_fk_position: 1.0
  lambda_fk_rotation: 1.0
  max_timestep_boundary: 1.0
  min_timestep_boundary: 0.0
  output_path: ${project.output_dir}/checkpoints
  save_steps: 500
  save_full_states_for_resume: true
  keep_last_k_ckpts: 1
  finetune_ckpt_path: ${oc.env:STAGE2_BASELINE_CHECKPOINT,null}
  resume_ckpt_path: null
  dataset_num_workers: 0

evaluation:
  # Joint video/action denoise budget; frozen goal keeps goal.num_steps.
  num_steps: 20
  max_cases: 64
  diagnostic_subset: false
  max_search_episodes: 16
  every_updates: 500
  at_start: true
  at_end: true

project:
  name: openwam-stage2
  output_dir: ${oc.env:STAGE2_OUTPUT_DIR,outputs/stage2}
  seed: 42
  wandb: null
