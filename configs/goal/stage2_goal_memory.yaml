base_config: stage1_goal_memory.yaml
stage: 2
projection_learning_rate: 1.0e-3
adam_betas: [0.9, 0.95]
weight_decay: 0.01
stage1_checkpoint: ${oc.env:STAGE1_GOAL_MEMORY_CHECKPOINT,null}
policy:
  attention_mode: isolated
  freeze_video: false
  keyframe_aux_weight: 0.1
  future_video_mode: none
  action_steps: 32
  action_dim: 112
  state_dim: 112
action_data:
  normalization_registry: ${oc.env:STAGE2_STATS_REGISTRY,null}
  future_video_mode: none
# Known 80->112 warm start through existing checked expansion helper.
initialization:
  expand_action_dim_from_checkpoint: true
inference:
  memory_kv_cache: true
  allow_approximate_low_precision_cache: false
