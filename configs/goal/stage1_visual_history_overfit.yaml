# Optimized native Wan visual history; bounded diagnostic, never an epoch claim.
base_config: stage1_multiview_sample.yaml
model:
  goal_representation: visual_history_masked_sa
  visual_history:
    num_history_tokens: 32
    pool_dim: 256
    pool_heads: 8
    adapter_block: 0
sample_order: global_shuffle
sample_fps: 1.0
seed: 42
max_updates: 1000
max_steps: 1000
repeat_population: true
checkpoint_every: 250
eval_every: 250
sampling_steps: 20
bootstrap_workers_per_node: 1
optimizer_device: model
history_learning_rate: 1.0e-4
sample_cache_size: 256
codec_cache_max_bytes: 536870912
dataset:
  cache_dir: outputs/stage1_visual_history/cache
  observation_augmentation:
    enabled: false
  history:
    enabled: true
    num_frames: 10
    mean_interval_s: 1.0
    jitter_fraction: 0.0
    frame_dropout_prob: 0.0
