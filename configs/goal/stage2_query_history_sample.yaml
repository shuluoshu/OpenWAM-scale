# @package _global_
history_enabled: true
defaults:
  - stage2_query_sample
  - _self_
model:
  query_history:
    enabled: ${history_enabled}
    num_frames: 10
    tokens_per_frame: 16
    compressor_dim: 128
    cache_size: 256
goal:
  history: ${model.query_history}
dataloader:
  history:
    enabled: ${history_enabled}
    num_frames: 10
    mean_interval_s: 1.0
    jitter_fraction: 0.0
    frame_dropout_prob: 0.2
project:
  name: openwam-stage2-query-history-sample
